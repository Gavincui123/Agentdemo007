<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="400" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">数据源对齐三角：一处空表，两条链路互相拆台</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#64748b">工作流校验走内存 mock，审批对账走 DB 表——两边看不到同一份数据就是事故</text>

  <!-- 三个节点 -->
  <rect x="60" y="100" width="240" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">OrderQueryService（内存 mock）</text>
  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#334155">ORD-001 / 002（10086）</text>
  <text x="180" y="170" text-anchor="middle" font-size="12" fill="#334155">ORD-003（10010·非本人）</text>
  <text x="180" y="188" text-anchor="middle" font-size="11" fill="#64748b">工作流图 validate 节点的数据源</text>

  <rect x="580" y="100" width="240" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">biz_order 表（MySQL）</text>
  <text x="700" y="150" text-anchor="middle" font-size="12" fill="#334155">HitlBusinessGate 对账锚点</text>
  <text x="700" y="170" text-anchor="middle" font-size="12" fill="#dc2626">事故前：只有 DDL 无种子 → 恒空</text>
  <text x="700" y="188" text-anchor="middle" font-size="11" fill="#64748b">fail-closed：「订单不存在」409</text>

  <rect x="320" y="270" width="240" height="86" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="440" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">审批动作（管理台 confirm）</text>
  <text x="440" y="318" text-anchor="middle" font-size="12" fill="#334155">HitlBusinessGate.check(ticket)</text>
  <text x="440" y="338" text-anchor="middle" font-size="11" fill="#64748b">退款查 payment_status · 退货查物流</text>

  <!-- 连线 -->
  <line x1="300" y1="148" x2="580" y2="148" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="440" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">数据源分裂（事故根因）</text>
  <line x1="180" y1="196" x2="360" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="196" x2="520" y2="268" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 修复 -->
  <rect x="60" y="270" width="220" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="170" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">修复：BizOrderSeedRunner</text>
  <text x="170" y="318" text-anchor="middle" font-size="12" fill="#334155">启动时按 mock 同源补三笔演示订单</text>
  <text x="170" y="338" text-anchor="middle" font-size="11" fill="#64748b">fill-if-absent · 种子绝不回写业务状态</text>
  <path d="M 280 313 L 318 313" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="299" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">对齐</text>

  <text x="440" y="384" text-anchor="middle" font-size="12" fill="#64748b">实测现象：工单 approve 必然 409「订单不存在」——两边各自「正常」，合起来必坏；对齐断言由 BizOrderSeedRunnerTest 钉死</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
