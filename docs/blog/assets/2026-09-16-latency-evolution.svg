<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="360" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">端到端延迟演进：80.5s → 6.1~11.9s</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#64748b">每根条 = 单轮端到端耗时（含主模型完整回答）· 调优周期 2026-09-15 ~ 09-16 · SiliconFlow 生产端点实测</text>

  <!-- 刻度参考线：x = 250 + s*6.95 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="389" y1="74" x2="389" y2="322"/>
    <line x1="528" y1="74" x2="528" y2="322"/>
    <line x1="667" y1="74" x2="667" y2="322"/>
    <line x1="806" y1="74" x2="806" y2="322"/>
  </g>

  <!-- 条 1：80.5s -->
  <text x="240" y="92" text-anchor="end" font-size="13" fill="#334155">调优前 · 思考模式开启</text>
  <rect x="250" y="76" width="559" height="34" rx="5" fill="#dc2626"/>
  <text x="817" y="98" font-size="14" font-weight="700" fill="#dc2626">80.5s</text>

  <!-- 条 2：67.1s -->
  <text x="240" y="144" text-anchor="end" font-size="13" fill="#334155">排查中期 · 链路问题逐一暴露</text>
  <rect x="250" y="128" width="466" height="34" rx="5" fill="#d97706"/>
  <text x="724" y="150" font-size="14" font-weight="700" fill="#d97706">67.1s</text>

  <!-- 条 3：6.4s -->
  <text x="240" y="196" text-anchor="end" font-size="13" fill="#334155">修复 1：意图驱动默认关思考</text>
  <rect x="250" y="180" width="45" height="34" rx="5" fill="#16a34a"/>
  <text x="305" y="202" font-size="14" font-weight="700" fill="#16a34a">6.4s</text>

  <!-- 条 4：70.5s -->
  <text x="240" y="248" text-anchor="end" font-size="13" fill="#334155">RAG 故障暴露 · 无超时的静默挂起</text>
  <rect x="250" y="232" width="490" height="34" rx="5" fill="#dc2626"/>
  <text x="748" y="254" font-size="14" font-weight="700" fill="#dc2626">70.5s</text>

  <!-- 条 5：6.1~11.9s -->
  <text x="240" y="300" text-anchor="end" font-size="13" fill="#334155">修复 2+3：超时预算 + 断路器收口</text>
  <rect x="250" y="284" width="83" height="34" rx="5" fill="#16a34a"/>
  <text x="343" y="306" font-size="14" font-weight="700" fill="#16a34a">6.1 ~ 11.9s</text>

  <!-- 底轴 -->
  <line x1="250" y1="322" x2="810" y2="322" stroke="#94a3b8" stroke-width="1.5"/>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="250" y="340">0</text>
    <text x="389" y="340">20s</text>
    <text x="528" y="340">40s</text>
    <text x="667" y="340">60s</text>
    <text x="806" y="340">80s</text>
  </g>
  <text x="440" y="356" text-anchor="middle" font-size="11" fill="#94a3b8">红色/橙色 = 用户全程盯打字点干等；绿色 = 正常服务水位（波动来自上游小模型方差，见正文 §3.3）</text>
</svg>
