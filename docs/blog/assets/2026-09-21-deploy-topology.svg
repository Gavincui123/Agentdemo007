<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="16" y="30" font-size="17" font-weight="bold" fill="#0f172a">部署拓扑：一进程即整站，闸口在应用内部（v3 定稿）</text>

  <!-- users -->
  <rect x="330" y="52" width="150" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="405" y="77" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">公网用户</text>

  <!-- nginx path -->
  <rect x="60" y="130" width="250" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="185" y="154" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">nginx 反代（:80 / :443）</text>
  <text x="185" y="174" font-size="10" fill="#475569" text-anchor="middle">proxy_pass → 172.20.0.1:8077（网桥网关）</text>
  <text x="185" y="190" font-size="10" fill="#475569" text-anchor="middle">buffering off · X-Real-IP 覆写 · read 超时 180s</text>

  <!-- direct path -->
  <rect x="490" y="130" width="260" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="154" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">8077 直连</text>
  <text x="620" y="174" font-size="10" fill="#475569" text-anchor="middle">0.0.0.0:8077 → 8080（容器端口映射）</text>
  <text x="620" y="190" font-size="10" fill="#475569" text-anchor="middle">拿到真实客户端 IP，闸口配额更准</text>

  <line x1="392" y1="92" x2="215" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="418" y1="92" x2="588" y2="126" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="240" y1="210" x2="320" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="560" y1="210" x2="490" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- app container -->
  <rect x="180" y="244" width="440" height="104" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="270" font-size="13.5" font-weight="bold" fill="#14532d" text-anchor="middle">agentdemo007 可执行 jar（~89MB，含 SPA）</text>
  <text x="400" y="292" font-size="10.5" fill="#166534" text-anchor="middle">JVM：-Xmx800m + Metaspace 256m + ExitOnOutOfMemoryError</text>
  <text x="400" y="312" font-size="10.5" fill="#166534" text-anchor="middle">闸口在应用内部：访问口令 + IP 日额（Redis INCR）+ /eval 仅本机</text>
  <text x="400" y="332" font-size="10" fill="#475569" text-anchor="middle">healthcheck：curl localhost:8080/health（start_period 90s）</text>

  <!-- middleware row -->
  <text x="16" y="434" font-size="10.5" fill="#475569">经 host.docker.internal（extra_hosts）连服务器既有实例——配置与数据全在容器外，重建容器不丢。</text>
  <g font-size="9.5" fill="#334155">
    <rect x="16" y="386" width="138" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="87" y="401" text-anchor="middle">MySQL :3379</text>
    <text x="87" y="414" text-anchor="middle">持久真相源</text>
    <rect x="164" y="386" width="138" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="233" y="401" text-anchor="middle">Redis :6379</text>
    <text x="233" y="414" text-anchor="middle">缓存 / 配额</text>
    <rect x="312" y="386" width="138" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="381" y="401" text-anchor="middle">RabbitMQ :5672</text>
    <text x="381" y="414" text-anchor="middle">异步发布</text>
    <rect x="460" y="386" width="138" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="529" y="401" text-anchor="middle">Nacos :8848+9848</text>
    <text x="529" y="414" text-anchor="middle">配置 / 闸口旋钮</text>
    <rect x="608" y="386" width="138" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="677" y="401" text-anchor="middle">Chroma :8001</text>
    <text x="677" y="414" text-anchor="middle">稠密向量</text>
  </g>
  <line x1="300" y1="348" x2="300" y2="382" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <line x1="480" y1="348" x2="480" y2="382" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- security note -->
  <rect x="16" y="52" width="270" height="66" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="34" y="74" font-size="11.5" font-weight="bold" fill="#991b1b">安全组：只放 80 / 443 / 8077</text>
  <text x="34" y="92" font-size="9" fill="#7f1d1d">3379 / 6379 / 5672 / 15672 / 8001 / 8848 / 9848 / 8000</text>
  <text x="34" y="107" font-size="9.5" fill="#7f1d1d">全部关闭或限自有 IP；口令只放 Nacos 不落明文</text>
</svg>
