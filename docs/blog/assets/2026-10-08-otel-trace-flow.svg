<svg xmlns="http://www.w3.org/2000/svg" width="880" height="508" viewBox="0 0 880 508" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="880" height="508" fill="#ffffff"/>
  <text x="16" y="30" font-size="17" font-weight="bold" fill="#0f172a">OpenTelemetry 链路数据流：traceId 对齐 → 业务 span 收口 → OTLP 导出 → Jaeger</text>

  <!-- app container -->
  <rect x="16" y="52" width="470" height="392" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="76" font-size="12.5" font-weight="bold" fill="#334155">应用进程（Agentdemo007 单 jar，收口三 seam）</text>

  <!-- request thread -->
  <rect x="28" y="88" width="446" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="42" y="110" font-size="12" font-weight="bold" fill="#1e3a8a">请求线程</text>
  <text x="42" y="132" font-size="10.5" fill="#1e40af">TraceFilter：traceId 进 MDC + X-Trace-Id 响应头</text>
  <text x="42" y="152" font-size="10.5" fill="#1e40af">HTTP server span（Boot starter 自动装配）</text>
  <text x="42" y="172" font-size="10.5" fill="#1e40af">agent.pipeline（root，makeCurrent）→ agent.step ×15</text>
  <text x="42" y="192" font-size="10.5" fill="#1e40af">gen_ai.chat / agent.rag.* / HTTP CLIENT（AgentTracer 门面收口）</text>
  <text x="42" y="218" font-size="10" fill="#64748b">MQ 出入站：OtelTraceContextPropagator @Primary 切换 W3C 真实现</text>

  <!-- alignment chip -->
  <rect x="28" y="250" width="446" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="42" y="271" font-size="12" font-weight="bold" fill="#92400e">MdcBackedIdGenerator —— traceId 对齐（恒开，应用契约不变式）</text>
  <text x="42" y="291" font-size="10.5" fill="#a16207">无父 span 沿用 MDC traceId → OTel traceId == X-Trace-Id == logback %X{traceId}</text>

  <!-- sse / mq thread boxes -->
  <rect x="28" y="314" width="216" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="40" y="335" font-size="11.5" font-weight="bold" fill="#14532d">sse- 线程（流式）</text>
  <text x="40" y="353" font-size="10" fill="#15803d">TraceSnapshot 捕获→恢复</text>
  <text x="40" y="368" font-size="10" fill="#15803d">span 不断根、traceId 不换</text>
  <rect x="258" y="314" width="216" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="270" y="335" font-size="11.5" font-weight="bold" fill="#4c1d95">MQ 消费线程（异步）</text>
  <text x="270" y="353" font-size="10" fill="#6d28d9">traceparent 随消息传播恢复</text>
  <text x="270" y="368" font-size="10" fill="#6d28d9">agent.mq.*.process（CONSUMER）</text>

  <text x="28" y="404" font-size="10" fill="#64748b">开关纪律：OTLP_ENABLED 同时驱动「OTLP 导出」与「W3C 传播切换」；traceId 对齐不挂开关。</text>
  <text x="28" y="422" font-size="10" fill="#64748b">降级口径：Tracer 缺失（切片单测 / 未装配）→ NO_OP 空实现，业务代码永不为 null、零副作用。</text>

  <!-- BatchSpanProcessor -->
  <rect x="516" y="196" width="146" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="589" y="222" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">BatchSpanProcessor</text>
  <text x="589" y="244" font-size="10" fill="#475569" text-anchor="middle">5s 批量导出</text>
  <text x="589" y="262" font-size="10" fill="#475569" text-anchor="middle">采样 1.0（默认 0.1 勿踩）</text>
  <text x="589" y="280" font-size="9.5" fill="#94a3b8" text-anchor="middle">~24 span/请求可承受</text>

  <!-- arrows app -> bsp -> jaeger -->
  <line x1="486" y1="244" x2="512" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="662" y1="244" x2="700" y2="244" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="683" y="236" font-size="9.5" fill="#64748b" text-anchor="middle">OTLP</text>

  <!-- jaeger -->
  <rect x="704" y="170" width="160" height="148" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="784" y="194" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Jaeger v2</text>
  <text x="784" y="216" font-size="10.5" fill="#1e40af" text-anchor="middle">all-in-one，OTLP :4318</text>
  <text x="784" y="234" font-size="10.5" fill="#1e40af" text-anchor="middle">UI :16686 只绑 127.0.0.1</text>
  <text x="784" y="256" font-size="10" fill="#475569" text-anchor="middle">endpoint 必须带 /v1/traces</text>
  <text x="784" y="272" font-size="10" fill="#475569" text-anchor="middle">（Boot 4 当完整 URL）</text>
  <text x="784" y="294" font-size="10" fill="#64748b" text-anchor="middle">mem_limit 384m · in-memory</text>
  <text x="784" y="308" font-size="10" fill="#64748b" text-anchor="middle">重启丢 trace 可接受</text>

  <!-- browser -->
  <rect x="704" y="352" width="160" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="784" y="376" font-size="11.5" font-weight="bold" fill="#14532d" text-anchor="middle">浏览器瀑布图</text>
  <text x="784" y="394" font-size="10" fill="#15803d" text-anchor="middle">生产走 SSH 隧道</text>
  <text x="784" y="408" font-size="10" fill="#15803d" text-anchor="middle">localhost:16686</text>
  <line x1="784" y1="318" x2="784" y2="348" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- bottom strip -->
  <rect x="16" y="458" width="848" height="36" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="32" y="481" font-size="11" font-weight="bold" fill="#92400e">检索锚点：X-Trace-Id 响应头的 32 位 hex = Jaeger Trace ID —— 拿响应头直接搜，一查一个准（对齐恒开的回报）</text>
</svg>
