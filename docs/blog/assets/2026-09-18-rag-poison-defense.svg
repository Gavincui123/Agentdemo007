<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">检索防线与毒性实验：精确归因每一层的「挡」与「放」</text>

  <!-- 主流程 -->
  <rect x="40" y="64" width="170" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="125" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">检索候选片段</text>
  <text x="125" y="108" text-anchor="middle" font-size="11" fill="#64748b">稠密 + 稀疏混合召回</text>
  <rect x="250" y="64" width="170" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="335" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">① 置信度终闸</text>
  <text x="335" y="108" text-anchor="middle" font-size="11" fill="#64748b">「最终动作」，非过滤之一</text>
  <rect x="460" y="64" width="180" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="550" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">② 注入扫描器</text>
  <text x="550" y="108" text-anchor="middle" font-size="11" fill="#64748b">进上下文前最后一道剔除</text>
  <rect x="680" y="64" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="760" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">入上下文 + 引用</text>
  <text x="760" y="108" text-anchor="middle" font-size="11" fill="#64748b">幸存片段 ≥ 下限</text>
  <line x1="210" y1="94" x2="246" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="420" y1="94" x2="456" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="640" y1="94" x2="676" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 毒片 1：指令注入 -->
  <rect x="40" y="180" width="170" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="125" y="202" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">毒片 1 · 指令注入文档</text>
  <text x="125" y="222" text-anchor="middle" font-size="11" fill="#b91c1c">「忽略之前所有指令」</text>
  <line x1="210" y1="207" x2="238" y2="207" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)"/>
  <circle cx="262" cy="207" r="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="262" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">✕</text>
  <text x="288" y="212" font-size="12" font-weight="600" fill="#dc2626">每轮在进上下文前被剔除</text>
  <path d="M 262 191 L 520 130" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 毒片 2：伪造政策（通过全部闸门） -->
  <rect x="40" y="280" width="170" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="125" y="302" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">毒片 2 · 伪造退款政策</text>
  <text x="125" y="322" text-anchor="middle" font-size="11" fill="#b91c1c">「实时到账」冒充现行口径</text>
  <path d="M 210 307 H 760 V 130" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ara)"/>
  <text x="490" y="297" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">通过全部闸门（置信度过闸 · 扫描器未命中）→ 进入 context 与引用列表</text>
  <path d="M 700 307 V 362" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ara)"/>

  <!-- 出答层结果 -->
  <rect x="240" y="366" width="560" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">伪造政策穿透防线直通 LLM——残余风险靠冲突仲裁指令 + citations 兜底</text>
  <text x="520" y="412" text-anchor="middle" font-size="11.5" fill="#475569">红队结论不是「防线全防住了」，而是精确知道哪一层挡了什么、哪一层放进来、放进来的靠什么兜底</text>

  <!-- 终闸判据 -->
  <rect x="40" y="440" width="800" height="66" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="60" y="462" font-size="11.5" font-weight="700" fill="#92400e">终闸判据（双判据）：被远程重排过 → relevance ≥ 0.3 · 未重排 → cosine ≥ 0.4 · BM25-only 且未重排 → 一律不得入上下文</text>
  <text x="60" y="482" font-size="11.5" font-weight="700" fill="#92400e">（字面匹配不能冒充语义置信度证据；0.4 为真库 dataId 口径·配置键 RAG_MIN_SCORE，dev 默认 0.3）</text>
  <text x="60" y="500" font-size="11.5" fill="#92400e">幸存片段数不足下限 → 整轮 RAG_SKIP 兜底话术——不是「有一点总比没有好」</text>
</svg>
