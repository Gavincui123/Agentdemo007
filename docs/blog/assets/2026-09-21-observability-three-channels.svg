<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="410" fill="#ffffff"/>
  <text x="16" y="30" font-size="17" font-weight="bold" fill="#0f172a">可观测三流：一次步骤产出，三个正交出口</text>

  <!-- source -->
  <rect x="16" y="130" width="190" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="111" y="160" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">流水线步骤产出</text>
  <text x="111" y="184" font-size="11.5" fill="#334155" text-anchor="middle">StepOutcome</text>
  <text x="111" y="204" font-size="10" fill="#64748b" text-anchor="middle">Proceed / Degrade /</text>
  <text x="111" y="220" font-size="10" fill="#64748b" text-anchor="middle">ShortCircuit / Retry</text>
  <text x="111" y="242" font-size="9.5" fill="#94a3b8" text-anchor="middle">Proceed/Retry 无审计</text>

  <!-- channel 1 -->
  <rect x="290" y="56" width="465" height="94" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="312" y="80" font-size="12.5" font-weight="bold" fill="#14532d">① SSE 实时进度信道（给浏览器）</text>
  <text x="312" y="102" font-size="10.5" fill="#15803d">step_started / step_finished / reply_chunk / reply_ready</text>
  <text x="312" y="122" font-size="10.5" fill="#475569">消费者：PipelineSpine 逐节点亮灯 · 与审计信道正交</text>

  <!-- channel 2 -->
  <rect x="290" y="166" width="465" height="94" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="312" y="190" font-size="12.5" font-weight="bold" fill="#1e3a8a">② 审计落库信道（给复盘的人）</text>
  <text x="312" y="212" font-size="10.5" fill="#1e40af">AuditEvent（append-only）→ MQ → audit_event 表</text>
  <text x="312" y="232" font-size="10.5" fill="#475569">13 种事件类型 · from(scenario) 单一映射源 · trace_id 可查</text>

  <!-- channel 3 -->
  <rect x="290" y="276" width="465" height="94" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="312" y="300" font-size="12.5" font-weight="bold" fill="#581c87">③ 指标快照信道（给可观测页）</text>
  <text x="312" y="322" font-size="10.5" fill="#7e22ce">AgentMetrics 门面 → /api/obs/summary 16 字段</text>
  <text x="312" y="342" font-size="10.5" fill="#475569">进程累计当下值 · 空指标→0 恒可用 · totalTurns 有滞后</text>

  <!-- arrows -->
  <line x1="206" y1="150" x2="284" y2="103" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="206" y1="195" x2="284" y2="212" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="206" y1="240" x2="284" y2="318" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- bottom note -->
  <rect x="16" y="380" width="738" height="22" rx="4" fill="#f8fafc"/>
  <text x="28" y="395" font-size="11" fill="#475569">正交性验收：关掉任意一条，其余两条照常——审计不依赖页面开着，指标不依赖有人看，进度不依赖落库成功。</text>
</svg>
