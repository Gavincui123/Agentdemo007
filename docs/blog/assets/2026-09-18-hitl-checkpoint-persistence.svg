<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="520" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">HITL 检查点三级持久化：内存真相源 + 异步副本 + 严格锚点恢复</text>

  <!-- 内存真相源 -->
  <rect x="50" y="70" width="250" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">内存状态机（真相源 · 单实例）</text>
  <text x="175" y="120" text-anchor="middle" font-size="11" fill="#334155">ConcurrentHashMap&lt;ticketId, Entry&gt;</text>
  <text x="175" y="142" text-anchor="middle" font-size="11.5" fill="#334155">ACTIVE → CONSUMED（CAS）</text>
  <text x="175" y="162" text-anchor="middle" font-size="11.5" fill="#334155">EXPIRED（漂移校验作废）</text>
  <text x="175" y="188" text-anchor="middle" font-size="11" fill="#64748b">重启不丢，靠右边两份副本 →</text>

  <!-- 异步双写 -->
  <rect x="350" y="70" width="180" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="440" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">checkpoint-writer</text>
  <text x="440" y="120" text-anchor="middle" font-size="11.5" fill="#475569">单守护线程 · 全异步双写</text>
  <text x="440" y="140" text-anchor="middle" font-size="11.5" fill="#475569">内存 → Redis + DB</text>
  <text x="440" y="160" text-anchor="middle" font-size="11.5" fill="#475569">不阻塞审批主线</text>
  <text x="440" y="186" text-anchor="middle" font-size="11" fill="#64748b">副本晚几百毫秒无关紧要</text>

  <!-- Redis / DB -->
  <rect x="590" y="70" width="250" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="715" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Redis 热副本</text>
  <text x="715" y="113" text-anchor="middle" font-size="11.5" fill="#334155">hitl:checkpoint:{ticketId} · TTL 24h</text>
  <rect x="590" y="138" width="250" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="715" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">DB 对账基准</text>
  <text x="715" y="181" text-anchor="middle" font-size="11.5" fill="#334155">hitl_checkpoint 表 · 异步镜像</text>

  <line x1="300" y1="135" x2="346" y2="135" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="530" y1="105" x2="586" y2="98" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="530" y1="165" x2="586" y2="166" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 恢复路径 -->
  <rect x="50" y="240" width="380" height="90" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="70" y="266" font-size="13" font-weight="700" fill="#92400e">恢复路径：严格锚点匹配（允许多工单并存）</text>
  <text x="70" y="288" font-size="12" font-weight="600" fill="#334155">findActiveForTicket(ticketId, expectedKey)</text>
  <text x="70" y="312" font-size="12" fill="#475569">键完全一致才产出；不一致 → 作废留痕，不拿旧检查点续跑</text>

  <!-- 对账 -->
  <rect x="460" y="240" width="380" height="90" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="480" y="266" font-size="13" font-weight="700" fill="#92400e">Redis ↔ DB 对账（冷路径兜底）</text>
  <text x="480" y="290" font-size="12" fill="#475569">Redis 残留 ACTIVE 而 DB 已终态 → 以 DB 为准剔除</text>
  <text x="480" y="312" font-size="12" fill="#475569">陈旧热副本不「复活」——对账基准永远在 DB</text>

  <line x1="175" y1="200" x2="175" y2="236" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <line x1="715" y1="194" x2="715" y2="236" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- fail-closed 收尾 -->
  <rect x="50" y="370" width="790" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="70" y="396" font-size="13" font-weight="700" fill="#b91c1c">HitlBusinessGate：工单收尾不自证，对账业务表（fail-closed）</text>
  <text x="70" y="418" font-size="12" fill="#475569">退款 → 查 biz_order.payment_status（仅 PAID 放行）· 退货 → 查物流状态（已签收 / 回寄中放行）</text>
  <text x="70" y="436" font-size="12" fill="#475569">订单不存在 / 查询失败 / 状态不符 → 一律 409 拒绝 · 检查点不消费，修复后可经 /admin/hitl/tickets/{id}/resume 重驱</text>
  <line x1="175" y1="330" x2="175" y2="366" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <line x1="650" y1="330" x2="650" y2="366" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <text x="440" y="488" text-anchor="middle" font-size="12" fill="#64748b">取舍明说：单实例内存真相 + 异步副本是 demo 口径；横向扩容需把检查点消费的 CAS 挪到 DB 乐观锁（语义已留，挪位置即可）。</text>
</svg>
