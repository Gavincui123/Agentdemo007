<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="440" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">RAG 检索漏斗：从宽召回到纯净片段的每一级数字</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#64748b">每级只减不增 · 漏斗终态零片段 = groundingMiss（拒答裁决的关键信号）· 配置见 application.yml app.rag.*</text>

  <rect x="60" y="76" width="760" height="40" rx="7" fill="#eff6ff" stroke="#2563eb"/>
  <text x="80" y="101" font-size="13.5" font-weight="700" fill="#1d4ed8">① 宽召回（稠密 24 + 稀疏 24）</text>
  <text x="800" y="101" text-anchor="end" font-size="12" fill="#334155">不截断、不预筛——弱信号不得替强信号淘汰</text>

  <rect x="100" y="124" width="680" height="40" rx="7" fill="#fef2f2" stroke="#dc2626"/>
  <text x="120" y="149" font-size="13.5" font-weight="700" fill="#b91c1c">①′ 权限过滤（ABAC：主体可见 且 等级 ≥ requiredLevel）</text>
  <text x="760" y="149" text-anchor="end" font-size="11.5" fill="#b91c1c">进漏斗前出局 → 引用零泄漏</text>

  <rect x="140" y="172" width="600" height="40" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="160" y="197" font-size="13.5" font-weight="700" fill="#334155">② 域窄化（domain 轴：只留当前业务域）</text>
  <text x="800" y="197" text-anchor="end" font-size="12" fill="#64748b">政策 / 商品 / 活动各归各</text>

  <rect x="180" y="220" width="520" height="40" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="200" y="245" font-size="13.5" font-weight="700" fill="#334155">③ 粗滤（score ≥ 0.2）</text>
  <text x="800" y="245" text-anchor="end" font-size="12" fill="#64748b">0.2~0.4 边际带留给 cross-encoder 裁决</text>

  <rect x="220" y="268" width="440" height="40" rx="7" fill="#fffbeb" stroke="#d97706"/>
  <text x="240" y="293" font-size="13.5" font-weight="700" fill="#92400e">④ 条件重排（池 &gt;10 才调远程 · 取 top-10）</text>
  <text x="800" y="293" text-anchor="end" font-size="12" fill="#92400e">挂了 → BM25 重排兜底（只改顺序）</text>

  <rect x="260" y="316" width="360" height="40" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="280" y="341" font-size="13.5" font-weight="700" fill="#166534">⑤ 置信度终闸（relevance ≥ 0.3 / cosine ≥ 0.4）</text>
  <text x="800" y="341" text-anchor="end" font-size="12" fill="#166534">BM25-only 未重排一律不入</text>

  <rect x="300" y="364" width="280" height="40" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="320" y="389" font-size="13.5" font-weight="700" fill="#166534">⑥ 注入扫描（18 条中英词库）</text>
  <text x="800" y="389" text-anchor="end" font-size="12" fill="#64748b">命中即剔除，静默消毒不短路</text>

  <text x="440" y="428" text-anchor="middle" font-size="12" fill="#64748b">过闸片段不足 min-count → 整轮 RAG_SKIP 兜底话术——不是「有一点总比没有好」</text>
</svg>
