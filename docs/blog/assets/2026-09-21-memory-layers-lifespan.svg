<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="380" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">四层记忆：信息保留跨度（对数刻度）</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#64748b">容量递增、时效递减：下层保真但短命，上层有损但长寿——L0 在 LLM 上下文之外独立兜底 correctness</text>

  <!-- 对数刻度：x = 250 + (log10(分钟)-1) * 138.6 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="358" y1="74" x2="358" y2="318"/>
    <line x1="549" y1="74" x2="549" y2="318"/>
    <line x1="666" y1="74" x2="666" y2="318"/>
    <line x1="754" y1="74" x2="754" y2="318"/>
    <line x1="820" y1="74" x2="820" y2="318"/>
  </g>

  <!-- L0 业务键注册表：30min -->
  <text x="240" y="96" text-anchor="end" font-size="13" font-weight="600" fill="#334155">L0 业务键注册表</text>
  <text x="240" y="113" text-anchor="end" font-size="11" fill="#64748b">WorkflowSubmissionRegistry</text>
  <rect x="250" y="80" width="66" height="34" rx="5" fill="#94a3b8"/>
  <text x="326" y="102" font-size="12.5" font-weight="600" fill="#64748b">30min · TTL 惰性过期（售后单 {action}:{orderId}）</text>

  <!-- L1 原文窗口 -->
  <text x="240" y="156" text-anchor="end" font-size="13" font-weight="600" fill="#334155">L1 原文窗口</text>
  <text x="240" y="173" text-anchor="end" font-size="11" fill="#64748b">SessionWindower</text>
  <rect x="250" y="140" width="108" height="34" rx="5" fill="#2563eb"/>
  <text x="368" y="162" font-size="12.5" font-weight="600" fill="#2563eb">最近 N 轮 · 预算 1200 token（字符启发式分轮，不拆 User/Ai 对）</text>

  <!-- L2 滚动摘要 -->
  <text x="240" y="216" text-anchor="end" font-size="13" font-weight="600" fill="#334155">L2 滚动摘要</text>
  <text x="240" y="233" text-anchor="end" font-size="11" fill="#64748b">SessionCompactionService</text>
  <rect x="250" y="200" width="299" height="34" rx="5" fill="#16a34a"/>
  <text x="559" y="222" font-size="11.5" font-weight="600" fill="#16a34a">会话全程 · ≤200 字（缓存 TTL 1h，每轮续期）</text>

  <!-- L3 用户画像 -->
  <text x="240" y="276" text-anchor="end" font-size="13" font-weight="600" fill="#334155">L3 用户画像</text>
  <text x="240" y="293" text-anchor="end" font-size="11" fill="#64748b">UserProfileService</text>
  <rect x="250" y="260" width="570" height="34" rx="5" fill="#d97706"/>
  <text x="535" y="282" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">跨会话 90d · TTL 惰性续期（读写都续满）· 仅表达层、永不承载权限语义</text>

  <!-- 底轴 -->
  <line x1="250" y1="318" x2="830" y2="318" stroke="#94a3b8" stroke-width="1.5"/>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="250" y="336">0</text>
    <text x="358" y="336">1h</text>
    <text x="549" y="336">1d</text>
    <text x="666" y="336">7d</text>
    <text x="754" y="336">30d</text>
    <text x="820" y="336">90d</text>
  </g>
  <text x="440" y="362" text-anchor="middle" font-size="11.5" fill="#94a3b8">L2 的价值：让「信息保留」超过 L1 窗口——窗口外的历史以摘要形态继续参与每轮 prompt；正确性关键实体另有 L0 与业务库兜底</text>
</svg>
