<svg xmlns="http://www.w3.org/2000/svg" width="880" height="568" viewBox="0 0 880 568" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect width="880" height="568" fill="#ffffff"/>
  <text x="16" y="30" font-size="17" font-weight="bold" fill="#0f172a">Jaeger 瀑布图读法：一棵树、一把尺、一层属性</text>

  <!-- search bar mock -->
  <rect x="16" y="44" width="848" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="32" y="70" font-size="11" fill="#334155">Service ▾ <tspan font-weight="bold" fill="#0f172a">Agentdemo007</tspan>　｜　Tags：<tspan font-weight="bold" fill="#0f172a">agent.scene=回答生成</tspan>　｜　<tspan fill="#2563eb" font-weight="bold">[ Find Traces ]</tspan></text>
  <text x="850" y="70" font-size="10" fill="#64748b" text-anchor="end">最快路径：贴 X-Trace-Id 的 32 位 hex 直查</text>

  <!-- ruler -->
  <text x="24" y="106" font-size="9.5" fill="#94a3b8">span 树（父子层级）</text>
  <line x1="130" y1="112" x2="690" y2="112" stroke="#e2e8f0" stroke-width="1"/>
  <text x="130" y="106" font-size="9" fill="#94a3b8">0s</text>
  <text x="242" y="106" font-size="9" fill="#94a3b8">1s</text>
  <text x="354" y="106" font-size="9" fill="#94a3b8">2s</text>
  <text x="466" y="106" font-size="9" fill="#94a3b8">3s</text>
  <text x="578" y="106" font-size="9" fill="#94a3b8">4s</text>
  <text x="682" y="106" font-size="9" fill="#94a3b8">5s</text>

  <!-- rows: name / bar / duration. bar zone x=130..690 (112px = 1s) -->
  <!-- r1 server -->
  <text x="24" y="132" font-size="10.5" fill="#0f172a" font-weight="bold">POST /api/chat</text>
  <rect x="130" y="122" width="537" height="13" rx="3" fill="#64748b"/>
  <text x="672" y="132" font-size="9.5" fill="#475569">4.8s</text>

  <!-- r2 pipeline -->
  <text x="38" y="158" font-size="10.5" fill="#0f172a" font-weight="bold">agent.pipeline ①</text>
  <rect x="160" y="148" width="507" height="13" rx="3" fill="#3b82f6"/>
  <text x="672" y="158" font-size="9.5" fill="#475569">4.6s</text>

  <!-- r3 intent step -->
  <text x="52" y="184" font-size="10" fill="#334155">agent.step 意图识别</text>
  <rect x="190" y="174" width="13" height="13" rx="3" fill="#60a5fa"/>
  <text x="672" y="184" font-size="9.5" fill="#94a3b8">0.12s</text>

  <!-- r4 rewrite step -->
  <text x="52" y="210" font-size="10" fill="#334155">agent.step 查询改写</text>
  <rect x="190" y="200" width="72" height="13" rx="3" fill="#60a5fa"/>
  <text x="672" y="210" font-size="9.5" fill="#94a3b8">0.64s</text>

  <!-- r5 gen_ai rewrite -->
  <text x="66" y="236" font-size="10" fill="#334155">gen_ai.chat <tspan fill="#94a3b8">改写 ③</tspan></text>
  <rect x="206" y="226" width="58" height="13" rx="3" fill="#f59e0b"/>
  <text x="672" y="236" font-size="9.5" fill="#94a3b8">0.52s</text>

  <!-- r6 rag step -->
  <text x="52" y="262" font-size="10" fill="#334155">agent.step rag_retrieve</text>
  <rect x="190" y="252" width="134" height="13" rx="3" fill="#60a5fa"/>
  <text x="672" y="262" font-size="9.5" fill="#94a3b8">1.2s</text>

  <!-- r7 rag.retrieve -->
  <text x="66" y="288" font-size="10" fill="#334155">agent.rag.retrieve</text>
  <rect x="206" y="278" width="112" height="13" rx="3" fill="#22c55e"/>
  <text x="672" y="288" font-size="9.5" fill="#94a3b8">1.0s</text>

  <!-- r8 HTTP Chroma -->
  <text x="80" y="314" font-size="10" fill="#334155">HTTP POST <tspan fill="#94a3b8">Chroma 出站</tspan></text>
  <rect x="222" y="304" width="100" height="13" rx="3" fill="#0ea5e9"/>
  <text x="672" y="314" font-size="9.5" fill="#94a3b8">0.89s</text>

  <!-- r9 rag.rerank -->
  <text x="66" y="340" font-size="10" fill="#334155">agent.rag.rerank</text>
  <rect x="206" y="330" width="20" height="13" rx="3" fill="#22c55e"/>
  <text x="672" y="340" font-size="9.5" fill="#94a3b8">0.18s</text>

  <!-- r10 rag.gate -->
  <text x="66" y="366" font-size="10" fill="#334155">agent.rag.gate</text>
  <rect x="206" y="356" width="3" height="13" rx="1.5" fill="#22c55e"/>
  <text x="672" y="366" font-size="9.5" fill="#94a3b8">12ms</text>

  <!-- r11 answer step -->
  <text x="52" y="392" font-size="10" fill="#334155" font-weight="bold">agent.step 回答生成 ②</text>
  <rect x="190" y="382" width="269" height="13" rx="3" fill="#60a5fa"/>
  <text x="672" y="392" font-size="9.5" fill="#475569">2.4s</text>

  <!-- r12 gen_ai answer -->
  <text x="66" y="418" font-size="10" fill="#334155">gen_ai.chat <tspan fill="#94a3b8">scene=回答生成</tspan></text>
  <rect x="206" y="408" width="258" height="13" rx="3" fill="#f59e0b"/>
  <text x="672" y="418" font-size="9.5" fill="#94a3b8">2.3s</text>

  <!-- r13 omitted -->
  <text x="52" y="444" font-size="10" fill="#94a3b8">…（其余步骤/LLM 出站示意省略 9 行）</text>

  <!-- r14 mq tail -->
  <text x="38" y="470" font-size="10" fill="#334155">agent.mq.audit.process ⑤ <tspan fill="#94a3b8">（异步尾巴）</tspan></text>
  <rect x="490" y="460" width="9" height="13" rx="3" fill="#a855f7"/>
  <text x="672" y="470" font-size="9.5" fill="#475569">0.08s · 晚 ~2.6s</text>

  <!-- annotation cards -->
  <rect x="700" y="118" width="164" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="712" y="139" font-size="11" font-weight="bold" fill="#1e3a8a">① 左树看层级</text>
  <text x="712" y="157" font-size="9.5" fill="#475569">缩进即父子：root 包着</text>
  <text x="712" y="172" font-size="9.5" fill="#475569">15 步，步内再包 LLM/RAG</text>

  <rect x="700" y="204" width="164" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="712" y="225" font-size="11" font-weight="bold" fill="#1e3a8a">② 条宽看耗时</text>
  <text x="712" y="243" font-size="9.5" fill="#475569">一眼定位瓶颈：回答生成</text>
  <text x="712" y="258" font-size="9.5" fill="#475569">2.4s 占全链路一半</text>

  <rect x="700" y="290" width="164" height="74" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="712" y="311" font-size="11" font-weight="bold" fill="#92400e">③ 点开看属性</text>
  <text x="712" y="329" font-size="9.5" fill="#475569">Tags 里有 scene / model /</text>
  <text x="712" y="344" font-size="9.5" fill="#475569">attempt / step.outcome</text>

  <rect x="700" y="376" width="164" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="712" y="397" font-size="11" font-weight="bold" fill="#334155">④ 顶栏看总览</text>
  <text x="712" y="415" font-size="9.5" fill="#475569">Service、总墙钟、span 数、</text>
  <text x="712" y="430" font-size="9.5" fill="#475569">trace 是否有 ERROR 状态</text>

  <rect x="700" y="462" width="164" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="712" y="483" font-size="11" font-weight="bold" fill="#4c1d95">⑤ 异步尾巴同 trace</text>
  <text x="712" y="501" font-size="9.5" fill="#475569">MQ 落库晚到 ~2.6s，</text>
  <text x="712" y="516" font-size="9.5" fill="#475569">但 traceId 相同，仍在图里</text>

  <!-- footer -->
  <text x="16" y="556" font-size="10" fill="#64748b">一轮同步 /chat（RAG 命中）实测 ≈24 个 span，此处示意 14 行；条宽按实测比例绘制，看结构不看凑数。</text>
</svg>
