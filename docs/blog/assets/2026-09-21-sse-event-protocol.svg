<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="16" y="30" font-size="17" font-weight="bold" fill="#0f172a">/chat/stream 的 SSE 事件协议：命名事件 + 权威终态 + 超时兜底</text>

  <!-- lifelines -->
  <rect x="90" y="52" width="170" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="70" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">浏览器</text>
  <text x="175" y="86" font-size="10" fill="#475569" text-anchor="middle">sse.ts + chat store</text>
  <line x1="175" y1="92" x2="175" y2="392" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="450" y="52" width="300" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="600" y="70" font-size="12.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">后端</text>
  <text x="600" y="86" font-size="10" fill="#475569" text-anchor="middle">ChatController · SseProgressEmitter</text>
  <line x1="600" y1="92" x2="620" y2="392" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- events -->
  <line x1="179" y1="116" x2="594" y2="116" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="387" y="110" font-size="11" fill="#334155" text-anchor="middle">POST /chat/stream（fetch + ReadableStream——事件是 POST，EventSource 不可用）</text>

  <line x1="596" y1="144" x2="181" y2="144" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="387" y="138" font-size="11" fill="#334155" text-anchor="middle">SseEmitter(120s) 立即返回——连接建立，另起工作线程跑流水线</text>

  <line x1="596" y1="172" x2="181" y2="172" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="387" y="166" font-size="11" fill="#334155" text-anchor="middle">step_started {step} × 15 步——PipelineSpine 逐节点亮灯</text>

  <line x1="596" y1="200" x2="181" y2="200" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="387" y="194" font-size="11" fill="#334155" text-anchor="middle">step_finished {step, outcome, scenario?}——降级节点整脊转琥珀</text>

  <line x1="596" y1="228" x2="181" y2="228" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="387" y="222" font-size="11" fill="#334155" text-anchor="middle">reply_chunk {text} × N——流式分片累积（乐观 UI，只是表演）</text>

  <line x1="596" y1="256" x2="181" y2="256" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="387" y="250" font-size="11.5" font-weight="bold" fill="#1e3a8a" text-anchor="middle">reply_ready {ChatResponse}——权威终态：整体替换流式半截内容</text>

  <line x1="596" y1="282" x2="181" y2="282" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="387" y="276" font-size="11" fill="#64748b" text-anchor="middle">complete——dead 标志置位；此后晚到的 emit 全部静默 no-op</text>

  <!-- timeout branch -->
  <rect x="90" y="306" width="660" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="110" y="330" font-size="12" font-weight="bold" fill="#991b1b">超时兜底（onTimeout）：SSE 窗口 120s 到期，而流水线尚未产出</text>
  <text x="110" y="352" font-size="11" fill="#7f1d1d">此前：连接被容器掐断，「晚到的成功」全部撞 already-completed 被吞，前端什么都收不到。</text>
  <text x="110" y="372" font-size="11" fill="#7f1d1d">现在：补发 reply_ready（负载 = 降级话术 PIPELINE_TIMEOUT）+ complete——兜底话术也是权威终态。</text>

  <text x="16" y="414" font-size="11" fill="#475569">前置拒绝（闸口/鉴权）走另一条岔路：HTTP 200 + JSON（非 event-stream）→ SseRejectionError，不可重试，message 透传为聊天气泡话术。</text>
</svg>
