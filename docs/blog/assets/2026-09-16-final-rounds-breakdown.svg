<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">最终验证：同一会话连续 4 轮的耗时分解</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" fill="#64748b">2026-09-16 生产端点真实联调 · 全程零挂起、SSE 4/4 优雅收尾</text>

  <!-- 图例 -->
  <rect x="120" y="68" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="140" y="80" font-size="12" fill="#334155">端到端总耗时</text>
  <rect x="260" y="68" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="280" y="80" font-size="12" fill="#334155">首字时间</text>

  <!-- 网格：y = 340 - v*20 （12s 上限）-->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="110" y1="280" x2="850" y2="280"/>
    <line x1="110" y1="220" x2="850" y2="220"/>
    <line x1="110" y1="160" x2="850" y2="160"/>
    <line x1="110" y1="100" x2="850" y2="100"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="end">
    <text x="100" y="344">0</text>
    <text x="100" y="284">3s</text>
    <text x="100" y="224">6s</text>
    <text x="100" y="164">9s</text>
    <text x="100" y="104">12s</text>
  </g>
  <line x1="110" y1="340" x2="850" y2="340" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 轮1：总 11.9 / 首字 11.5 -->
  <rect x="151" y="102" width="44" height="238" rx="4" fill="#2563eb"/>
  <text x="173" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">11.9</text>
  <rect x="205" y="110" width="44" height="230" rx="4" fill="#16a34a"/>
  <text x="227" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">11.5</text>
  <text x="200" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">轮 1 · 推理题</text>
  <text x="200" y="384" text-anchor="middle" font-size="11" fill="#64748b">REASONING → large</text>
  <text x="200" y="400" text-anchor="middle" font-size="11" fill="#64748b">前置 4 次（7405ms 为大头）</text>

  <!-- 轮2：总 11.4 / 首字 10.6 -->
  <rect x="336" y="112" width="44" height="228" rx="4" fill="#2563eb"/>
  <text x="358" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">11.4</text>
  <rect x="390" y="128" width="44" height="212" rx="4" fill="#16a34a"/>
  <text x="412" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">10.6</text>
  <text x="385" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">轮 2 · 耳机推荐</text>
  <text x="385" y="384" text-anchor="middle" font-size="11" fill="#64748b">OTHER → large + 工具</text>
  <text x="385" y="400" text-anchor="middle" font-size="11" fill="#64748b">话题隔离：零上文残留</text>

  <!-- 轮3：总 11.9 / 首字 2.1（高亮） -->
  <rect x="521" y="102" width="44" height="238" rx="4" fill="#2563eb"/>
  <text x="543" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">11.9</text>
  <rect x="575" y="298" width="44" height="42" rx="4" fill="#16a34a" stroke="#d97706" stroke-width="2.5"/>
  <text x="597" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">2.1</text>
  <text x="570" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">轮 3 · 退货×22 复读</text>
  <text x="570" y="384" text-anchor="middle" font-size="11" fill="#64748b">规则分诊命中 · 免意图/免路由</text>
  <text x="570" y="400" text-anchor="middle" font-size="11" fill="#64748b">仅 1 次前置调用（RAG 政策×2）</text>

  <!-- 轮4：总 6.1 / 首字 5.8 -->
  <rect x="706" y="218" width="44" height="122" rx="4" fill="#2563eb"/>
  <text x="728" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">6.1</text>
  <rect x="760" y="224" width="44" height="116" rx="4" fill="#16a34a"/>
  <text x="782" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">5.8</text>
  <text x="755" y="366" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">轮 4 · 手机壳推荐</text>
  <text x="755" y="384" text-anchor="middle" font-size="11" fill="#64748b">OTHER → large + 工具</text>
  <text x="755" y="400" text-anchor="middle" font-size="11" fill="#64748b">路由计划仅 1946ms</text>

  <!-- 标注：规则命中是最快的路（右上空白区，避开轮4柱体） -->
  <path d="M 614 288 Q 645 225 666 174" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="660" y="120" width="196" height="52" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="758" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">规则命中是最快的路：</text>
  <text x="758" y="160" text-anchor="middle" font-size="12" fill="#92400e">跳过 2~3 次前置 LLM，首字 2.1s</text>

  <text x="440" y="434" text-anchor="middle" font-size="11.5" fill="#94a3b8">轮 1 与轮 4 同为 4 次前置调用，总耗时差近一倍——差异几乎全部来自路由计划那一次小模型调用（7.4s vs 1.9s）</text>
  <text x="440" y="452" text-anchor="middle" font-size="11.5" fill="#94a3b8">慢已从「我们的代码挂了」变成「上游小模型的方差」</text>
</svg>
