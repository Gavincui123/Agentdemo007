<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="640" fill="#ffffff"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">意图识别四级链路：决策模型优先、同轮回退、熔断自动切回</text>
  <text x="440" y="54" text-anchor="middle" font-size="12" fill="#64748b">规则层恒在最前（零 LLM）· LingDT 任何失败形态不暴露给用户 · 冷却 30s 后半开探测自动切回，全程无人值守</text>

  <!-- 用户消息 -->
  <rect x="50" y="78" width="300" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="200" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">用户消息（rawInput）</text>
  <line x1="200" y1="116" x2="200" y2="134" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrGray)"/>

  <!-- 规则前置 -->
  <rect x="50" y="136" width="300" height="58" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="200" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">规则前置（零 LLM）</text>
  <text x="200" y="176" text-anchor="middle" font-size="11" fill="#64748b">关键词表 + 注入模式库 —— 命中即返回</text>
  <line x1="350" y1="165" x2="466" y2="165" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="408" y="155" text-anchor="middle" font-size="11" fill="#16a34a">命中（含注入拦截）</text>
  <line x1="200" y1="194" x2="200" y2="234" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrGray)"/>
  <text x="212" y="220" font-size="11" fill="#64748b">无定论</text>

  <!-- O1 命中出口 -->
  <rect x="470" y="140" width="360" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="650" y="161" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">命中 → 直接返回</text>
  <text x="650" y="179" text-anchor="middle" font-size="11" fill="#64748b">注入在此拦截，零 LLM 出站（不因新通道破例）</text>

  <!-- ① LingDT -->
  <rect x="50" y="236" width="300" height="88" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="200" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">① LingDT-Decision（决策型大模型）</text>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#334155">一道 choice 题：state{history, latest_message}</text>
  <text x="200" y="292" text-anchor="middle" font-size="11" fill="#334155">questions.intent.criteria = 5 意图定义（单一真源）</text>
  <text x="200" y="308" text-anchor="middle" font-size="11" fill="#334155">返回 choice + confidence（真实置信度透传）</text>
  <line x1="350" y1="256" x2="466" y2="256" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="408" y="246" text-anchor="middle" font-size="11" fill="#16a34a">成功</text>

  <!-- O2 成功出口 -->
  <rect x="470" y="232" width="360" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="650" y="253" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">成功 → Intent + 真实置信度</text>
  <text x="650" y="271" text-anchor="middle" font-size="11" fill="#64748b">模型分布确定度透传（替代写死 0.7），低于 0.6 阈值即落 unknown</text>

  <!-- 熔断器注记 -->
  <polyline points="352,290 490,290 490,298" fill="none" stroke="#d97706" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="470" y="300" width="360" height="92" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="650" y="321" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">熔断器：单次失败开断（窗 60s / 冷却 30s）</text>
  <text x="650" y="340" text-anchor="middle" font-size="11" fill="#78350f">开路 → 跳过①零等待直回②，不白吃 15s 读超时</text>
  <text x="650" y="356" text-anchor="middle" font-size="11" fill="#78350f">冷却期满半开放一次探测：成功自动切回①</text>
  <text x="650" y="372" text-anchor="middle" font-size="11" fill="#78350f">阈值 1＝RAG 同款口径：有同级兜底，快速降级代价最小</text>

  <!-- 失败回退 -->
  <line x1="200" y1="324" x2="200" y2="410" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="212" y="350" font-size="11" fill="#dc2626">任何失败形态：HTTP 非 2xx / 超时 / errorCode≠0</text>
  <text x="212" y="366" font-size="11" fill="#dc2626">answers 缺失 / choice 越界 / 解析失败 / 熔断开路</text>
  <text x="212" y="390" font-size="12" font-weight="700" fill="#dc2626">同轮回退 —— 用户无感</text>

  <!-- ② 通用小模型 -->
  <rect x="50" y="412" width="300" height="74" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="200" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">② 通用小模型（原通道，原样保留）</text>
  <text x="200" y="452" text-anchor="middle" font-size="11" fill="#334155">prompt 分类 → 自由文本 → 两轮解析</text>
  <text x="200" y="468" text-anchor="middle" font-size="11" fill="#334155">置信度写死 0.7；不可解析 → unknown</text>
  <line x1="350" y1="432" x2="466" y2="432" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="408" y="422" text-anchor="middle" font-size="11" fill="#16a34a">成功</text>

  <!-- O3 成功出口 -->
  <rect x="470" y="408" width="360" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="650" y="429" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">成功 → Intent + 0.7</text>
  <text x="650" y="447" text-anchor="middle" font-size="11" fill="#64748b">回退口径与接入前完全一致</text>

  <!-- unknown 兜底 -->
  <line x1="200" y1="486" x2="200" y2="526" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrGray)"/>
  <text x="212" y="512" font-size="11" fill="#64748b">仍失败（两级都挂才到这）</text>
  <rect x="50" y="528" width="300" height="52" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="200" y="549" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">unknown 兜底：OTHER / 0.0</text>
  <text x="200" y="567" text-anchor="middle" font-size="11" fill="#64748b">不阻塞 —— 下游按基线路由继续</text>

  <text x="440" y="612" text-anchor="middle" font-size="11.5" fill="#64748b">规则层恒在最前：转人工 / 注入永不进模型；两级模型都挂才落 unknown，韧性口径与接入前一致</text>
</svg>
