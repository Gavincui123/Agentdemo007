<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">会话决策层：三层递进，每层独立成立</text>

  <!-- 用户消息 -->
  <rect x="120" y="54" width="440" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="340" y="81" text-anchor="middle" font-size="14" fill="#334155">用户消息（“我要退货”→“我要退款”→“ORD-001”→“算了不退了”）</text>
  <line x1="340" y1="98" x2="340" y2="116" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 确定性状态机（原样保留） -->
  <rect x="80" y="120" width="520" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">售后工作流状态机 @670（确定性分支 · 原样保留，不推翻）</text>
  <line x1="340" y1="176" x2="340" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 第一层 -->
  <rect x="60" y="204" width="560" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="84" y="228" font-size="14" font-weight="700" fill="#0f172a">第一层 · routePlan 能力契约（本轮能力决策唯一出处，下游只执行不猜）</text>
  <text x="84" y="249" font-size="12" fill="#475569">收敛层修正候选值：售后轮 needsRag=false · 无订单号 needsBusinessTools=false</text>
  <text x="84" y="266" font-size="12" fill="#475569">澄清/衔接/确认终态从不消费主线 RAG —— T3 那轮 26s 漏斗浪费直接归零</text>
  <line x1="340" y1="276" x2="340" y2="300" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 第二层 -->
  <rect x="60" y="304" width="560" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="84" y="328" font-size="14" font-weight="700" fill="#0f172a">第二层 · 提交业务记忆 WorkflowSubmissionRegistry</text>
  <text x="84" y="349" font-size="12" fill="#475569">业务键 {action}:{orderId}（跨会话稳定）· sessionId → 最近提交键索引</text>
  <text x="84" y="366" font-size="12" fill="#475569">同键 = 衔接（已在处理中）· 同动作不同订单 = 新实体 · TTL 30min 惰性过期</text>
  <line x1="340" y1="376" x2="340" y2="400" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 第三层 -->
  <rect x="60" y="404" width="560" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="84" y="428" font-size="14" font-weight="700" fill="#0f172a">第三层 · 会话仲裁器 WorkflowTurnArbiter（方案A）</text>
  <text x="84" y="449" font-size="12" fill="#475569">仅状态机搞不定的三种情形触发（活跃提交消歧 / 多动作绑定 / 澄清冲突）</text>
  <text x="84" y="466" font-size="12" fill="#475569">小模型通道 ~1-2s · 四判定：CONTINUE_ACTIVE / WITHDRAW / BIND_RUN / CLARIFY</text>

  <!-- 失败回退 -->
  <rect x="660" y="224" width="196" height="192" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="758" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">任何失败 / 越界</text>
  <text x="758" y="276" text-anchor="middle" font-size="11" fill="#b91c1c">LLM 缺席 / 异常</text>
  <text x="758" y="294" text-anchor="middle" font-size="11" fill="#b91c1c">JSON 不合法 / 判定越界</text>
  <text x="758" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Optional.empty()</text>
  <text x="758" y="348" text-anchor="middle" font-size="13" fill="#334155">↓ 回退</text>
  <text x="758" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">原样走确定性分支</text>
  <text x="758" y="396" text-anchor="middle" font-size="11" fill="#64748b">既有测试零感知</text>

  <!-- 三层 → 回退框 的虚线 -->
  <line x1="620" y1="240" x2="656" y2="272" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="620" y1="340" x2="656" y2="326" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="620" y1="440" x2="656" y2="376" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- 回退框 → 状态机 的回路 -->
  <path d="M 758 224 L 758 148 L 604 148" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="770" y="196" font-size="11" fill="#dc2626">失败回退</text>

  <text x="340" y="520" text-anchor="middle" font-size="12" fill="#64748b">不推翻纪律：LLM 层只做「状态机搞不定」的增量判断；判定空间收在解析层，越界即弃、缺位即回。</text>
</svg>
