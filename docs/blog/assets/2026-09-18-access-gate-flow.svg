<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="620" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">统一访问闸口：一个旋钮三效应（enabled=true 一次性生效）</text>

  <!-- 主流程 -->
  <rect x="170" y="60" width="340" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="340" y="87" text-anchor="middle" font-size="13" fill="#334155">入口请求（聊天 / 登录 / 评测端点）</text>
  <line x1="340" y1="104" x2="340" y2="120" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="170" y="124" width="340" height="52" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="340" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">闸口开关 enabled？</text>
  <text x="340" y="166" text-anchor="middle" font-size="11" fill="#64748b">agentdemo-gate.json · Nacos 热更新（改完秒级生效不重启）</text>
  <line x1="340" y1="176" x2="340" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="170" y="196" width="340" height="52" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="340" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">本机来源？localhost 豁免判定</text>
  <text x="340" y="238" text-anchor="middle" font-size="11" fill="#64748b">IP 解析顺序：X-Real-IP → XFF 第一跳 → TCP 对端</text>
  <line x1="340" y1="248" x2="340" y2="264" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="170" y="268" width="340" height="52" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="340" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">路径是 /eval/** ？</text>
  <text x="340" y="310" text-anchor="middle" font-size="11" fill="#64748b">评测跑真实 LLM 全量黄金集，比聊天更烧钱、必须更严</text>
  <line x1="340" y1="320" x2="340" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="352" y="333" font-size="11" fill="#64748b">否（聊天路径）</text>

  <rect x="170" y="340" width="340" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="340" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">口令校验 codeMatches（常量时间比较）</text>
  <text x="340" y="382" text-anchor="middle" font-size="11" fill="#64748b">期望口令未配置 → fail-closed 全拒（暴露配置遗漏）</text>
  <line x1="340" y1="392" x2="340" y2="408" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="170" y="412" width="340" height="52" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="340" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">IP 日额 tryAcquire（每 IP 每日 5 轮）</text>
  <text x="340" y="454" text-anchor="middle" font-size="11" fill="#64748b">自然日按 Asia/Shanghai · 存储故障 → fail-open 放行</text>
  <line x1="340" y1="464" x2="340" y2="480" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="170" y="484" width="340" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="511" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">放行 → 进入流水线</text>

  <!-- 右侧分支 -->
  <line x1="510" y1="150" x2="594" y2="150" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="552" y="142" text-anchor="middle" font-size="11" fill="#64748b">false</text>
  <rect x="600" y="124" width="250" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 3"/>
  <text x="725" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">enabled=false → 全部放开</text>
  <text x="725" y="166" text-anchor="middle" font-size="11" fill="#64748b">dev 零门槛联调</text>

  <line x1="510" y1="222" x2="594" y2="222" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="552" y="214" text-anchor="middle" font-size="11" fill="#64748b">true</text>
  <rect x="600" y="196" width="250" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 3"/>
  <text x="725" y="218" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">localhost 豁免</text>
  <text x="725" y="238" text-anchor="middle" font-size="11" fill="#64748b">口令与额度全免（本机联调不拦自己）</text>

  <line x1="510" y1="294" x2="594" y2="294" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="552" y="286" text-anchor="middle" font-size="11" fill="#64748b">true</text>
  <rect x="600" y="262" width="250" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5 3"/>
  <text x="725" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">外部 IP：401 仅限本机</text>
  <text x="725" y="304" text-anchor="middle" font-size="11" fill="#b91c1c">在 token 鉴权之前拦截——</text>
  <text x="725" y="320" text-anchor="middle" font-size="11" fill="#b91c1c">连试 token 的机会都没有</text>

  <text x="440" y="556" text-anchor="middle" font-size="11.5" fill="#64748b">口令只放 Nacos，不进仓库、不进环境变量明文</text>
  <text x="440" y="578" text-anchor="middle" font-size="11.5" fill="#64748b">配额存储做成 seam：REDIS_ENABLED=true → Redis INCR + 首写 48h TTL；否则内存 Map（重启清零，4096 键剪枝）</text>
  <text x="440" y="600" text-anchor="middle" font-size="11.5" fill="#64748b">localhost 豁免的信任链 = nginx 覆写 X-Real-IP + 8080 端口只对内——绕过 nginx 直连的请求不受闸门保护，靠安全组兜底</text>
</svg>
