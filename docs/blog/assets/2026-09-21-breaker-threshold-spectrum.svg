<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="880" height="330" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">熔断阈值光谱：主链路偏松，旁路一步到位</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#64748b">横轴 = 开断路所需连续失败次数 · 选型依据是「兜底通道的质量」与「误熔断的代价」</text>

  <!-- 比例：1 → 90px，5 → 450px；条起点 x=300 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="390" y1="74" x2="390" y2="258"/>
    <line x1="480" y1="74" x2="480" y2="258"/>
    <line x1="570" y1="74" x2="570" y2="258"/>
    <line x1="660" y1="74" x2="660" y2="258"/>
    <line x1="750" y1="74" x2="750" y2="258"/>
  </g>

  <!-- 模型级 5 -->
  <text x="290" y="96" text-anchor="end" font-size="13" font-weight="600" fill="#334155">模型级（主链路）</text>
  <rect x="300" y="80" width="450" height="30" rx="5" fill="#2563eb"/>
  <text x="758" y="100" font-size="13" font-weight="700" fill="#2563eb">5 次</text>

  <!-- 工具级 3 -->
  <text x="290" y="151" text-anchor="end" font-size="13" font-weight="600" fill="#334155">工具级（per-tool）</text>
  <rect x="300" y="135" width="270" height="30" rx="5" fill="#16a34a"/>
  <text x="578" y="155" font-size="13" font-weight="700" fill="#16a34a">3 次</text>

  <!-- RAG 1 -->
  <text x="290" y="206" text-anchor="end" font-size="13" font-weight="600" fill="#334155">RAG 稠密 / 重排</text>
  <rect x="300" y="190" width="90" height="30" rx="5" fill="#d97706"/>
  <text x="398" y="210" font-size="13" font-weight="700" fill="#d97706">1 次</text>

  <!-- 画像 1 -->
  <text x="290" y="261" text-anchor="end" font-size="13" font-weight="600" fill="#334155">画像读路径</text>
  <rect x="300" y="245" width="90" height="30" rx="5" fill="#d97706"/>
  <text x="398" y="265" font-size="13" font-weight="700" fill="#d97706">1 次</text>

  <!-- 理由注记 -->
  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#64748b">模型是主链路、误熔断代价高 → 阈值偏松（5 次 / 窗 60s / 冷却 30s）；</text>
  <text x="440" y="320" text-anchor="middle" font-size="12" fill="#64748b">工具与 RAG/画像是旁路、各有兜底（终答如实说明 / BM25 基线 / 无画像照常答）→ 单次失败即快速降级，代价最小</text>
</svg>
