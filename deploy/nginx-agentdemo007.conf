# Agentdemo007 站点：替换 nginx 容器内旧前端站点（放 /etc/nginx/conf.d/ 下或改 default.conf）。
# 前提：应用 8080 只绑 127.0.0.1（docker-compose.prod.yml 已限定）；安全组只放 80/443。
# 172.17.0.1 是 docker0 网关——nginx 容器经它访问宿主机上发布的 8080。
server {
    listen 80;
    server_name _;

    # 知识库上传单文件上限 10MB（应用侧限制），留余量
    client_max_body_size 12m;

    location / {
        # 应用宿主侧端口 8077（8080 被 Nacos 容器占用）；172.20.0.1 是 nginx 所在网桥的网关 IP，
        # 与 docker-compose.prod.yml 的端口绑定对应（绑了 172.20.0.1 与 172.19.0.1 两个网关）
        proxy_pass http://172.20.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 闸口配额键：必须由 nginx 覆写 X-Real-IP（$remote_addr），防客户端伪造 XFF 刷每日额度
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 流式必需：禁缓冲 + 读超时 > 应用 SSE 窗口 120s
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
